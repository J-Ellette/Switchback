name: CI

on:
  push:
  workflow_dispatch:

jobs:
  android:
    name: Android build and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK and run unit tests
        run: ./gradlew assembleDebug testDebugUnitTest --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: switchback-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14

  tiles:
    name: Tile tool tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Test the Planetiler profile
        run: ./gradlew -p tools/tiles test --stacktrace
